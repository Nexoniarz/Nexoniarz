<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Nexoniarz">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010d"/>
      <stop offset="0.62" stop-color="#1a0630"/>
      <stop offset="1" stop-color="#05010d"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#b14dff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="inkWrap" href="#ink" spreadMethod="reflect"/>

    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="0.55" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#b14dff"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="210" width="900" height="110" fill="url(#fade)"/></mask>

    <!-- sun with horizontal cut-out stripes -->
    <mask id="sunCut">
      <rect width="900" height="320" fill="#fff"/>
      <rect x="0" y="150" width="900" height="3" fill="#000"/>
      <rect x="0" y="168" width="900" height="5" fill="#000"/>
      <rect x="0" y="186" width="900" height="7" fill="#000"/>
      <rect x="0" y="202" width="900" height="9" fill="#000"/>
    </mask>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
  </defs>

  <style>
    .word { font-family: "Arial Black", "Segoe UI Black", Impact, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 92px; letter-spacing: 6px; }
    .sub  { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; letter-spacing: 8px; fill: #8be9fd; }

    .glitchA { fill: #00f0ff; mix-blend-mode: screen; animation: gA 3.2s steps(1) infinite; opacity: 0.85; }
    .glitchB { fill: #ff2bd6; mix-blend-mode: screen; animation: gB 3.2s steps(1) infinite; opacity: 0.85; }
    @keyframes gA {
      0%, 86%, 100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
      88% { transform: translate(-7px, 2px); clip-path: inset(10% 0 55% 0); }
      90% { transform: translate(5px, -1px); clip-path: inset(60% 0 8% 0); }
      92% { transform: translate(-3px, 0); clip-path: inset(35% 0 40% 0); }
      94% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
    }
    @keyframes gB {
      0%, 86%, 100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
      88% { transform: translate(7px, -2px); clip-path: inset(50% 0 20% 0); }
      90% { transform: translate(-6px, 1px); clip-path: inset(5% 0 70% 0); }
      92% { transform: translate(4px, 0); clip-path: inset(70% 0 5% 0); }
      94% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
    }

    .flicker { animation: flick 6s linear infinite; }
    @keyframes flick {
      0%, 41%, 43%, 45%, 100% { opacity: 1; }
      42%, 44% { opacity: 0.55; }
    }

    .grid { animation: roll 1.2s linear infinite; }
    @keyframes roll { from { transform: translateY(0); } to { transform: translateY(24px); } }

    .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: 0.15; } }

    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px); } 60%, 100% { transform: translateX(1200px); } }

    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- backdrop -->
  <rect width="900" height="320" rx="14" fill="url(#sky)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="60"  cy="40"  r="1.2" style="animation-delay:0s"/>
    <circle class="star" cx="140" cy="90"  r="0.9" style="animation-delay:1.1s"/>
    <circle class="star" cx="230" cy="30"  r="1.4" style="animation-delay:0.4s"/>
    <circle class="star" cx="330" cy="70"  r="0.8" style="animation-delay:2.2s"/>
    <circle class="star" cx="560" cy="28"  r="1.1" style="animation-delay:1.7s"/>
    <circle class="star" cx="640" cy="85"  r="0.9" style="animation-delay:0.8s"/>
    <circle class="star" cx="730" cy="42"  r="1.3" style="animation-delay:2.6s"/>
    <circle class="star" cx="830" cy="100" r="1"   style="animation-delay:1.4s"/>
    <circle class="star" cx="870" cy="30"  r="0.8" style="animation-delay:0.2s"/>
    <circle class="star" cx="30"  cy="130" r="0.9" style="animation-delay:2s"/>
  </g>

  <!-- retro sun -->
  <circle cx="450" cy="210" r="96" fill="#ff4d8d" opacity="0.35" filter="url(#soft)"/>
  <circle cx="450" cy="210" r="88" fill="url(#sun)" mask="url(#sunCut)"/>

  <!-- horizon + perspective grid -->
  <rect x="0" y="210" width="900" height="110" fill="#05010d"/>
  <g mask="url(#gridMask)" stroke="#ff2bd6" stroke-width="1.4" opacity="0.9">
    <g class="grid">
      <line x1="0" y1="210" x2="900" y2="210"/>
      <line x1="0" y1="216" x2="900" y2="216"/>
      <line x1="0" y1="226" x2="900" y2="226"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="0" y1="258" x2="900" y2="258"/>
      <line x1="0" y1="282" x2="900" y2="282"/>
      <line x1="0" y1="312" x2="900" y2="312"/>
      <line x1="0" y1="186" x2="900" y2="186"/>
      <line x1="0" y1="198" x2="900" y2="198"/>
    </g>
    <line x1="450" y1="210" x2="450"  y2="320"/>
    <line x1="450" y1="210" x2="330"  y2="320"/>
    <line x1="450" y1="210" x2="570"  y2="320"/>
    <line x1="450" y1="210" x2="210"  y2="320"/>
    <line x1="450" y1="210" x2="690"  y2="320"/>
    <line x1="450" y1="210" x2="90"   y2="320"/>
    <line x1="450" y1="210" x2="810"  y2="320"/>
    <line x1="450" y1="210" x2="-30"  y2="320"/>
    <line x1="450" y1="210" x2="930"  y2="320"/>
    <line x1="450" y1="210" x2="-150" y2="320"/>
    <line x1="450" y1="210" x2="1050" y2="320"/>
  </g>
  <rect x="0" y="209" width="900" height="2" fill="#ff7be5"/>

  <!-- the name -->
  <g class="flicker">
    <text class="word" x="450" y="150" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs" fill="#05010d" stroke="url(#inkWrap)" stroke-width="3" filter="url(#glow)">NEXONIARZ</text>
    <text class="word glitchA" x="450" y="150" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs">NEXONIARZ</text>
    <text class="word glitchB" x="450" y="150" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs">NEXONIARZ</text>
    <text class="word" x="450" y="150" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs" fill="url(#inkWrap)">NEXONIARZ</text>
  </g>

  <!-- light sweep across the letters -->
  <g class="sweep"><rect x="0" y="60" width="60" height="110" fill="#fff" opacity="0.10" transform="skewX(-20)"/></g>

  <text class="sub" x="450" y="292" text-anchor="middle">&gt; ONLINE<tspan class="caret">_</tspan></text>

  <!-- CRT scanlines + frame -->
  <rect width="900" height="320" rx="14" fill="url(#scan)"/>
  <rect x="1" y="1" width="898" height="318" rx="13" fill="none" stroke="#b14dff" stroke-opacity="0.55" stroke-width="2"/>
</svg>
